# Load the SDM660 sensor stack at boot.
#
# qcom_sns_reg serves the sensor registry (sns.reg) to the ADSP; the ADSP
# then announces the SMGR service over QRTR, and qcom_smgr turns the registry
# entries into platform devices that the per-sensor IIO drivers bind to.
#
# The kernel already autoloads most of these through their module aliases
# (auxiliary:qcom_common.sns-reg and qrtr:100:3201).  Listing them here makes
# the bring-up deterministic and keeps the sensors working on systems whose
# udev does not process QRTR modalias events.
qcom_sns_reg
qcom_smgr
qcom_smgr_accel
qcom_smgr_gyro
qcom_smgr_mag
qcom_smgr_prox
