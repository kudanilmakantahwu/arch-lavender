# The Q6 DSP does not bridge a 24-bit front end to the 16-bit Primary MI2S
# backend correctly.  PipeWire otherwise opens the ALSA speaker sink at
# S24_LE while the machine driver fixes the backend at 48 kHz/S16_LE, and the
# DSP passes only the low 16 bits of each sample to the MAX98937.  The result
# is clean audio that is about 48 dB (a factor of 256) too quiet, no matter
# what the ALSA or PipeWire volume is set to.
#
# Force the sink to S16LE so the front end matches the 16-bit backend.  This
# is a sink property, so it covers every client that plays through the
# speaker, including Waydroid's PulseAudio output.  It does not affect the
# headphone or microphone nodes.
#
# Verify while audio is playing:
#   cat /proc/asound/card0/pcm0p/sub0/hw_params   # format: S16_LE
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*Speaker.*"
      }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]
