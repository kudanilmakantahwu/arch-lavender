# Microphone capture for the Xiaomi Redmi Note 7 (lavender).
#
# Keep this in its own UCM verb.  PipeWire's ACP probes every device in a
# profile when it activates the verb; on 7.2.3 the MultiMedia2 capture PCM
# (hw:X7,1) fails to open with EINVAL, which made the whole "HiFi" profile
# unsupported and left users with only "Dummy Output" -- no speaker at all.
# With capture in a separate verb, the HiFi (speaker) profile stays usable
# even when the microphone path cannot be probed.

SectionDevice."Mic" {
	Comment "Internal microphone"

	EnableSequence [
		cset "name='MultiMedia2 Mixer LPI_MI2S_TX_3' 1"
		cset "name='ADC1 Volume' 8"
	]

	DisableSequence [
		cset "name='MultiMedia2 Mixer LPI_MI2S_TX_3' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
	}
}