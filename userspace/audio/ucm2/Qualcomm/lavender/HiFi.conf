# Use case configuration for the Xiaomi Redmi Note 7 (lavender)
# Audio paths:
#   - Speaker: external MAX98937 smart amplifier on Primary MI2S
#   - Microphone: PM660L codec (PM8916-compatible analog), LPI MI2S TX3

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
	]
	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='Speaker Volume' 6"
		cset "name='Digital Volume' 100"
	]

	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Internal microphone"

	EnableSequence [
		cset "name='MultiMedia2 Mixer LPI_MI2S_TX_3' 1"
		cset "name='ADC1 Volume' 8"
	]

	DisableSequence [
		cset "name='MultiMedia2 Mixer LPI_MI2S_TX_3' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
	}
}
