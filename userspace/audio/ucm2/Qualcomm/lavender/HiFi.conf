# Use case configuration for the Xiaomi Redmi Note 7 (lavender)
# Audio paths:
#   - Speaker: external MAX98937 smart amplifier on Primary MI2S
#   - Microphone: PM660L codec (PM8916-compatible analog), LPI MI2S TX3
#
# Speaker gain staging
# --------------------
# The MAX98937 has two cascaded gain controls:
#
#   "Speaker Volume"  R003B[2:0]  +3 dB .. +21 dB, 3 dB steps
#                                 0 = +3 dB, 5 = +18 dB, 6 = +21 dB
#   "Digital Volume"  R0036[6:0]  -16 dB .. +15.75 dB, 0.25 dB steps
#                                 0 = -16 dB, 56 = -2 dB, 64 = 0 dB,
#                                 127 = +15.75 dB
#
# The driver's init sequence (kernel/patches/local/0001-ASoC-add-MAX98937...)
# writes the vendor values: Digital Volume 0x38 (56, -2 dB) and Speaker
# Volume 5 (+18 dB).  This profile keeps the vendor digital gain and raises
# only the analog speaker gain one step, to 6 (+21 dB), for loudness.  An
# earlier revision instead set Digital Volume 127 (+15.75 dB); that ~18 dB of
# *digital* gain clips the DAC on full-scale audio, which was the crackle.
# Keep Digital Volume at 56 and let PipeWire's per-stream volume attenuate.
#
# The remaining values are also the vendor init values:
#   "Amp DSP Switch"        (BROWNOUT_DSP_EN) 0 = off
#   "Ramp Switch"           (RMP_BYPASS!)     0 = soft ramp enabled
#   "Volume Location Switch"(AMP_VOL_SEL)     0 = volume at the DAC input
#   "Boost Output Voltage"                    10 V
#   "Current Limit"                           1.00 A (raw 0x40)
#
# Current-limit caveat: the MAX98937 vendor register map encodes the limit as
# raw = (index << 1) + 2, so the vendor init value 0x40 is 4.10 A (maximum).
# The mainline-style control in our driver omits that +2 offset and preserves
# bit 6, so the "4.10A" item (index 31) writes 0x7E, which is not a valid
# vendor value.  The "1.00A" item (index 0) writes 0x40 and therefore keeps
# the vendor maximum.  Do not change this until the driver mapping is fixed.
#
# Note that "Ramp Switch" is inverted by the driver: it maps to RMP_BYPASS,
# so writing 1 disables the ramp and brings back the switch-on pop.

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='Digital Volume' 56"
		cset "name='Speaker Volume' 6"
		cset "name='Amp DSP Switch' 0"
		cset "name='Ramp Switch' 0"
		cset "name='Volume Location Switch' 0"
		cset "name='Boost Output Voltage' 10V"
		cset "name='Current Limit' 1.00A"
	]
	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='Digital Volume' 56"
		cset "name='Speaker Volume' 6"
		cset "name='Amp DSP Switch' 0"
		cset "name='Ramp Switch' 0"
		cset "name='Volume Location Switch' 0"
		cset "name='Boost Output Voltage' 10V"
		cset "name='Current Limit' 1.00A"
	]

	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
