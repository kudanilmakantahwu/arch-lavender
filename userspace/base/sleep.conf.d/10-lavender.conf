# lavender: s2idle never completes on this kernel.  A cycle logs
# "WARNING ... clk_branch_toggle", can spend ~16 minutes in resume, and one
# cycle hard-locked CPU5 in systemd-sleep.  Refuse suspend requests so a stray
# gsd-power/phosh timer fails cleanly instead of hanging the phone.  The
# session defaults script also turns the GNOME/Phosh timers off; power the
# phone off when it is not in use.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
