name: build-kernel
description: Build the sdm660-mainline kernel and package it for the Redmi Note 7

runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
        df -h /

    - name: Build kernel inside Alpine
      shell: bash
      run: |
        mkdir -p kernel/out
        docker run --rm \
          -v "$GITHUB_WORKSPACE/kernel:/work" \
          -w /work \
          -e KBUILD_BUILD_USER=ci \
          -e KBUILD_BUILD_HOST=github-actions \
          alpine:edge sh /work/build.sh

    - name: Package kernel + modules
      shell: bash
      run: |
        set -e
        cd kernel/out
        KVER="7.2.3-sdm660"
        rm -f "linux-${KVER}.zip"
        zip -qr "linux-${KVER}.zip" \
          vmlinuz vmlinuz.efi System.map \
          dtbs/qcom/sdm660-xiaomi-lavender-shenchao.dtb \
          modroot/usr/lib/modules
        ls -lh "linux-${KVER}.zip"

    - name: Build boot image
      shell: bash
      run: |
        set -e
        INITRD="$GITHUB_WORKSPACE/initramfs/arch-initramfs-fsck.gz"
        if [ ! -f "$INITRD" ]; then
          echo "::warning::initramfs/arch-initramfs-fsck.gz is missing, skipping boot image"
          exit 0
        fi
        python3 kernel/mkboot.py \
          --kernel kernel/out/vmlinuz \
          --dtb kernel/out/dtbs/qcom/sdm660-xiaomi-lavender-shenchao.dtb \
          --ramdisk "$INITRD" \
          --out "kernel/out/boot-7.2.3-sdm660.img" \
          --cmdline "console=tty0 loglevel=7 rootwait rw"

    - name: Checksums
      shell: bash
      run: |
        cd kernel/out
        sha256sum linux-*.zip boot-*.img 2>/dev/null > sha256sums-kernel.txt || true
        cat sha256sums-kernel.txt

    - name: Summary
      shell: bash
      run: |
        {
          echo "## kernel 7.2.3-sdm660"
          echo
          echo '```'
          ls -lh kernel/out/vmlinuz kernel/out/linux-*.zip kernel/out/boot-*.img 2>/dev/null || true
          cat kernel/out/sha256sums-kernel.txt 2>/dev/null || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"