name: release

# Tag-triggered kernel build.  The assets are uploaded with a "-ci" suffix so
# they never overwrite the proven boot image / kernel zip that a maintainer
# uploaded after testing on hardware.  Promote them by hand when they are
# verified.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Build kernel, modules and boot image
        uses: ./.github/actions/build-kernel

      - name: Publish CI assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          KVER=7.2.3-sdm660
          cp "kernel/out/linux-${KVER}.zip" "kernel/out/linux-${KVER}-ci.zip"
          cp "kernel/out/boot-${KVER}.img" "kernel/out/boot-${KVER}-ci.img"

          NOTES=$(cat <<EOF
          Arch Linux ARM for the Redmi Note 7 (xiaomi-lavender), kernel ${KVER}.

          **Default install boots straight into Phosh** on tty1.  SSH over USB
          and WiFi stay enabled, and getty@tty2 is kept as a text-console
          fallback (Ctrl+Alt+F2).  The cairo renderer workaround for the
          Adreno 512 GTK4 glyph bug is applied by default.

          The \`-ci\` assets on this release were built by GitHub Actions from this
          tag.  Test them with \`fastboot boot boot-${KVER}-ci.img\` before
          promoting them over the proven \`arch-lavender-boot.img\` and
          \`linux-${KVER}.zip\`.

          The sanitized root filesystem (\`rootfs-arch.tar.zst\`) is uploaded
          manually because it cannot be rebuilt without a device.  Use
          \`rootfs/build-rootfs.sh\` to turn it into a flashable image.

          Read docs/INSTALL.md before flashing anything.
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "kernel/out/linux-${KVER}-ci.zip" \
              "kernel/out/boot-${KVER}-ci.img" \
              kernel/out/sha256sums-kernel.txt \
              --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "$NOTES" \
              "kernel/out/linux-${KVER}-ci.zip" \
              "kernel/out/boot-${KVER}-ci.img" \
              kernel/out/sha256sums-kernel.txt
          fi